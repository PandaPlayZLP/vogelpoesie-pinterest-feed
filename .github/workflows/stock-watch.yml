name: Stock watch

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check stock
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
        run: python scripts/stock_watch.py

      - name: Open or update "Low stock" issue
        if: hashFiles('low-stock.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search '"Low stock" in:title' \
            --json number,title --jq '[.[] | select(.title == "Low stock")][0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file low-stock.md
          else
            gh issue create --title "Low stock" --body-file low-stock.md
          fi
