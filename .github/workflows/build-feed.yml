name: Build Pinterest feed

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Generate feed.tsv
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHOP_ID: ${{ vars.ETSY_SHOP_ID }}
        run: python scripts/pinterest_feed.py

      - name: Commit feed.tsv if changed
        run: |
          if git diff --quiet -- feed.tsv; then
            echo "feed.tsv unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.tsv
          git commit -m "chore: regenerate feed.tsv"
          git push
