name: Build Pinterest feed

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Generate feed.tsv
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ vars.ETSY_SHOP_ID }}
        run: python scripts/pinterest_feed.py

      - name: Commit feed.tsv if changed
        run: |
          if git diff --quiet -- feed.tsv; then
            echo "feed.tsv unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.tsv
          git commit -m "chore: regenerate feed.tsv"
          git push

      - name: Purge the CDN cache
        run: |
          curl -sS "https://purge.jsdelivr.net/gh/PandaPlayZLP/vogelpoesie-pinterest-feed@main/feed.tsv" || true

      # The same check that would have caught the months-long 404: the apex
      # tinod.me redirects everything to the portfolio, and every github.io
      # project URL follows that redirect, so the file being committed says
      # nothing about whether Pinterest can fetch it.
      - name: Verify the public feed URL serves the file
        run: |
          url="https://cdn.jsdelivr.net/gh/PandaPlayZLP/vogelpoesie-pinterest-feed@main/feed.tsv"
          curl -sS --fail --retry 5 --retry-delay 5 --retry-all-errors "$url" -o /tmp/served.tsv
          head -1 /tmp/served.tsv | grep -q $'^id\ttitle' || {
            echo "::error::$url does not start with the feed header"; exit 1; }
          echo "public feed serves $(($(wc -l < /tmp/served.tsv) - 1)) rows"
